<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cofrinho a Dois</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cofrinho">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F15" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{--bg:#F5F6FA;--marca:#2D1B44;--destaque:#FC7255}
  @media (prefers-color-scheme: dark){:root{--bg:#0B0F15}}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
  #medida{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #abertura{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--marca);color:#fff;font:600 17px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:opacity .35s}
  #abertura.some{opacity:0;pointer-events:none}
  #abertura img{width:112px;height:112px;border-radius:26px;box-shadow:0 12px 32px rgb(0 0 0 / .35)}
  #abertura small{font-weight:400;opacity:.75;font-size:14px}
  .pontos{display:flex;gap:6px}.pontos i{width:8px;height:8px;border-radius:50%;background:var(--destaque);animation:pulo 1s infinite ease-in-out}
  .pontos i:nth-child(2){animation-delay:.15s}.pontos i:nth-child(3){animation-delay:.3s}
  @keyframes pulo{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-6px);opacity:1}}
  #semRede{display:none;margin-top:8px;text-align:center}
  #semRede button{margin-top:12px;padding:12px 28px;border:0;border-radius:24px;background:var(--destaque);color:#fff;font:600 16px sans-serif}
  #abertura.offline .pontos,#abertura.offline .carregando{display:none}
  #abertura.offline #semRede{display:block}
</style>
</head>
<body>
<div id="abertura">
  <img src="icons/icon-512.png" alt="">
  <div>Cofrinho a Dois</div>
  <div class="pontos"><i></i><i></i><i></i></div>
  <small class="carregando">Abrindo…</small>
  <div id="semRede"><div>Sem internet</div><small>Confira a conexão e tente de novo.</small><br><button id="denovo">Tentar de novo</button></div>
</div>
<div id="medida"></div>
<iframe id="app" title="Cofrinho a Dois" allow="clipboard-write; microphone; camera"></iframe>
<script>
  // O app de verdade (Apps Script). Esta página só dá a ele ícone, tela cheia e tela de abertura no celular.
  var APP = 'https://script.google.com/macros/s/AKfycbyP0Fl25FRweYGTr83WmOJFa0qsiqnUIoyrtRPgHRAL_tqQezHnLajE4axSuhW-mLBE/exec';
  var abertura = document.getElementById('abertura'), frame = document.getElementById('app'), aberto = false, timer;

  function mostrarApp(){ if (aberto) return; aberto = true; clearTimeout(timer); abertura.classList.add('some'); }
  function carregar(){
    aberto = false; abertura.classList.remove('some', 'offline');
    if (!navigator.onLine) { abertura.classList.add('offline'); return; }
    frame.src = APP;
    timer = setTimeout(mostrarApp, 12000);   // se o app não avisar, mostra assim mesmo
  }
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.cofrinho !== 1) return;
    if (d.bg) { document.documentElement.style.setProperty('--bg', d.bg);
      document.querySelectorAll('meta[name=theme-color]').forEach(function(m){ m.setAttribute('content', d.bg); }); }
    if (d.pronto) mostrarApp();
    // o app ocupa a tela toda; contamos a ele o tamanho do relógio (em cima) e da barrinha (embaixo) do iPhone
    try { var cs = getComputedStyle(document.getElementById('medida'));
      e.source.postMessage({cofrinho:'margens', top:parseFloat(cs.paddingTop)||0, bottom:parseFloat(cs.paddingBottom)||0}, '*'); } catch (err) {}
  });
  frame.addEventListener('load', function(){ setTimeout(mostrarApp, 2500); });
  document.getElementById('denovo').addEventListener('click', carregar);
  window.addEventListener('online', function(){ if (abertura.classList.contains('offline')) carregar(); });
  carregar();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
